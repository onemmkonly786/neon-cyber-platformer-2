name: Build Neon Cyber Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'game.js'
      - 'style.css'
      - 'audio.js'
      - 'particles.js'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install project dependencies
        run: npm install

      - name: Prepare game files for Android
        run: |
          mkdir -p www
          cp index.html game.js style.css audio.js particles.js www/

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set Android app to landscape and immersive fullscreen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          android = Path('android/app/src/main')
          manifest = android / 'AndroidManifest.xml'
          ns = {'android': 'http://schemas.android.com/apk/res/android'}
          ET.register_namespace('android', ns['android'])
          tree = ET.parse(manifest)
          root = tree.getroot()
          app = root.find('application')
          activity = app.find('activity')
          if activity is None:
              raise SystemExit('Main activity was not found in AndroidManifest.xml')
          activity.set('{%s}screenOrientation' % ns['android'], 'landscape')
          tree.write(manifest, encoding='utf-8', xml_declaration=True)

          # Hide the status bar through the app theme as well.
          values = android / 'res/values'
          values.mkdir(parents=True, exist_ok=True)
          styles = values / 'styles.xml'
          if styles.exists():
              st = ET.parse(styles)
              sr = st.getroot()
              style = None
              for item in sr.findall('style'):
                  if item.get('name') in ('AppTheme.NoActionBar', 'AppTheme'):
                      style = item
                      break
              if style is None:
                  style = ET.SubElement(sr, 'style', {'name': 'AppTheme.NoActionBar'})
              ET.SubElement(style, 'item', {'name': 'android:windowFullscreen'}).text = 'true'
              st.write(styles, encoding='utf-8', xml_declaration=True)

          # Enable immersive sticky mode so Android navigation/status bars stay hidden during play.
          candidates = list((android / 'java').rglob('MainActivity.java')) + list((android / 'kotlin').rglob('MainActivity.kt'))
          if not candidates:
              raise SystemExit('Could not find generated MainActivity source file')
          main = candidates[0]
          source = main.read_text()
          method = '''\n    @Override\n    public void onWindowFocusChanged(boolean hasFocus) {\n        super.onWindowFocusChanged(hasFocus);\n        if (hasFocus) {\n            getWindow().getDecorView().setSystemUiVisibility(\n                android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY\n                | android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE\n                | android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION\n                | android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN\n                | android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION\n                | android.view.View.SYSTEM_UI_FLAG_FULLSCREEN\n            );\n        }\n    }\n'''
          if main.suffix == '.java':
              if 'onWindowFocusChanged(boolean hasFocus)' not in source:
                  pos = source.rfind('}')
                  source = source[:pos] + method + source[pos:]
          else:
              raise SystemExit('Unexpected Kotlin MainActivity; workflow expects generated Java activity')
          main.write_text(source)
          print('Landscape and immersive fullscreen enabled.')
          PY

      - name: Configure reliable Gradle download
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('android/gradle/wrapper/gradle-wrapper.properties')
          lines = p.read_text().splitlines()

          url = 'distributionUrl=https\\://downloads.gradle.org/distributions/gradle-8.11.1-bin.zip'
          lines = [url if line.startswith('distributionUrl=') else line for line in lines]

          if not any(line.startswith('distributionUrl=') for line in lines):
              raise SystemExit('Gradle distributionUrl was not found')

          lines = [line for line in lines if not line.startswith('networkTimeout=')]
          lines.append('networkTimeout=120000')

          p.write_text('\n'.join(lines) + '\n')
          print('Gradle download configured successfully.')
          PY

          
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew assembleDebug; then
              exit 0
            fi
            echo "Build attempt $attempt failed. Retrying..."
            sleep 10
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Cyber-Platformer-APK-Landscape
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
