
name: Build Neon Cyber Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'game.js'
      - 'style.css'
      - 'audio.js'
      - 'particles.js'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: npm install @capacitor/android@^7.4.3

      - name: Create Android project
        run: npx cap add android

      - name: Install Android platform
        run: npm install @capacitor/android@^7.4.3

      - name: Prepare Android assets
        run: |
          mkdir -p android/app/src/main/assets
          echo "[]" > android/app/src/main/assets/capacitor.plugins.json

      - name: Sync game
        run: npx cap sync android

      - name: Verify Capacitor files
        run: |
          ls -la android/app/src/main/assets/
          test -f android/app/src/main/assets/capacitor.plugins.json

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Cyber-Platformer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
